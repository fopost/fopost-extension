name: Release

# Tag the commit as v<version> matching package.json, e.g. v0.2.0. The job
# builds the store zip and attaches it to a GitHub release; uploading to the
# Chrome Web Store stays manual, since each submission needs listing review.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          [ "$VERSION" = "$TAG" ] || { echo "::error::package.json is $VERSION but tag is $TAG"; exit 1; }

      - run: npm run lint
      - run: npm run build

      - name: Verify manifest version matches package.json
        run: |
          MANIFEST=$(node -p "JSON.parse(require('fs').readFileSync('dist/manifest.json','utf8')).version")
          VERSION=$(node -p "require('./package.json').version")
          [ "$MANIFEST" = "$VERSION" ] || { echo "::error::manifest is $MANIFEST but package.json is $VERSION"; exit 1; }

      - name: Build store zip
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd dist && zip -r "../fopost-extension-$VERSION.zip" .

      - name: Attach zip to the release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "$GITHUB_REF_NAME" "fopost-extension-$VERSION.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "fopost-extension-$VERSION.zip" --clobber
