name: Release

# Tag the commit as v<version> matching package.json, e.g. v0.2.0. The job
# builds one store zip per browser and attaches both to a GitHub release.
# Uploading them stays manual: the Chrome Web Store and AMO each review their
# own listing, and the two reviews do not run on the same clock.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          [ "$VERSION" = "$TAG" ] || { echo "::error::package.json is $VERSION but tag is $TAG"; exit 1; }

      - run: npm run lint
      - run: npm run build
      - run: npm run lint:firefox

      - name: Verify manifest version matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for target in chrome firefox; do
            MANIFEST=$(node -p "JSON.parse(require('fs').readFileSync('dist/$target/manifest.json','utf8')).version")
            [ "$MANIFEST" = "$VERSION" ] \
              || { echo "::error::$target manifest is $MANIFEST but package.json is $VERSION"; exit 1; }
          done

      - name: Build store zips
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for target in chrome firefox; do
            (cd "dist/$target" && zip -r "../../fopost-extension-$target-$VERSION.zip" .)
          done

      - name: Attach zips to the release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ZIPS="fopost-extension-chrome-$VERSION.zip fopost-extension-firefox-$VERSION.zip"
          gh release create "$GITHUB_REF_NAME" $ZIPS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" $ZIPS --clobber
